name: Publish Node SDK to npm

# Publishes sdk/node to npm as `webscrape-ai`, with build provenance.
#
# Requires one repo secret:
#   NPM_TOKEN - an npm Granular Access Token with "Read and write" on the
#               webscrape-ai package (or All packages). "Bypass 2FA" must be
#               enabled so CI can publish non-interactively.
#
# Trigger by pushing a tag like `node-v0.1.0`, or run manually from the
# Actions tab. Bump the version in package.json AND src/version.ts first
# (a test keeps them in sync).

on:
  push:
    tags:
      - "node-v*"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # `prepublishOnly` rebuilds dist/ during publish; --provenance needs the
      # id-token permission above and a public repo.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
